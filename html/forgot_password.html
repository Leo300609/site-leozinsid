<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container-recover">
      <h1>Recuperação de Senha ⚖️</h1>

      <p>Digite seu email para receber o link de recuperação</p>

      <input
        type="email"
        id="emailRecover"
        placeholder="seuemail@exemplo.com"
      />

      <button onclick="sendRecovery()">Enviar</button>

      <p class="back-login" onclick="goBack()">Voltar para login</p>
    </div>

    <script src="js/script_forgot_password.js"></script>
  </body>
</html>
