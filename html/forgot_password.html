<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LESI Consultas</title>
    <link rel="stylesheet" href="../css/style.css" />

    <link rel="icon" type="image/png+xml" href="../img/fav-icon.png" />
  </head>

  <body>
    <div class="container-recover">
      <h1>Recuperação de Senha ⚖️</h1>

      <p>Digite seu email para receber o link de recuperação</p>

      <input
        class="input-senha"
        type="email"
        id="emailRecover"
        placeholder="seuemail@exemplo.com"
      />

      <button onclick="sendRecovery()">Enviar</button>

      <p class="links" onclick="goBack()">Voltar para login</p>
    </div>

    <script src="../js/script_forgot_pass.js"></script>
  </body>
</html>
