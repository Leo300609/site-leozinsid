<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style_main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>LESI Consultas</title>
    <link rel="icon" type="image/png+xml" href="../img/fav-icon.png" />
  </head>

  <body>
    <div class="wrapper">
      <header>
        <div class="header-left">
          <button id="menu-toggle" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
          </button>

          <div class="logo">
            <div class="logo-icon">⚖</div>
            <div class="logo-info">
              <div class="logo-text">LESI</div>
              <div class="logo-sub">Consultas Jurídicas</div>
            </div>
          </div>
        </div>

        <div class="list-header">
          <a href="index.html" target="_blank"
            ><button class="btn-nav">Entrar</button></a
          >
          <a href="index.html" target="_blank"
            ><button class="btn-nav">Cadastre-se</button></a
          >
        </div>
      </header>

      <div class="content-container">
        <aside class="sidebar" id="sidebar">
          <h2>Menu</h2>
          <a href="#"><i class="fa-solid fa-house"></i> Início</a>
          <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Pesquisa</a>
          <a href="#"><i class="fa-solid fa-briefcase"></i> Meus Casos</a>
          <a href="#"><i class="fa-solid fa-circle-question"></i> Ajuda</a>
        </aside>

        <main>
          <div class="search">
            <h1>Consulte seus processos jurídicos</h1>
            <input
              type="text"
              id="cpf"
              maxlength="14"
              placeholder="Digite seu CPF: 000.000.000-00"
              oninput="mascaraCPF(this)"
              class="my-input"
            />
            <button class="btn-buscar">Buscar</button>
          </div>
        </main>
      </div>
    </div>

    <script>
      // Função para mostrar/esconder a sidebar
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("active");
      }

      function mascaraCPF(input) {
        let value = input.value;
        value = value.replace(/\D/g, "");
        value = value.replace(/(\d{3})(\d)/, "$1.$2");
        value = value.replace(/(\d{3})(\d)/, "$1.$2");
        value = value.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        input.value = value;
      }
    </script>
  </body>
</html>
