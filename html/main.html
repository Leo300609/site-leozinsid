<!-- LOGO LESI - Jurídico (para topo da página e guia/favicon) -->
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LESI Advocacia</title>

    <!-- Favicon da guia -->
    <link rel="icon" type="image/png+xml" href="../img/fav-icon.png" />

    <style>
      body {
        font-family: "Rajdhani", sans-serif;
        font-weight: 400;
        font-style: normal;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        background-color: #000000;
      }

      /* Topo */
      header {
        background: #0d1b2a;
        padding: 15px 40px;
        display: flex;
        align-items: center;
      }

      /* Logo topo */
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        color: white;
      }

      .logo-icon {
        width: 55px;
        height: 55px;
        background: #c9a227;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: bold;
        color: #0d1b2a;
      }

      .logo-text {
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 2px;
      }

      .logo-sub {
        font-size: 12px;
        color: #d9d9d9;
        margin-top: -5px;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo">
        <div class="logo-icon">⚖</div>
        <div>
          <div class="logo-text">LESI</div>
          <div class="logo-sub">Assessoria Jurídica</div>
        </div>
      </div>
    </header>
  </body>
</html>
