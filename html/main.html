<!-- LOGO LESI - Jurídico (para topo da página e guia/favicon) -->
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LESI Advocacia</title>

    <!-- Favicon da guia -->
    <link rel="icon" type="image/png+xml" href="../img/fav-icon.png" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap");

      body {
        font-family: "Rajdhani", sans-serif;
        font-weight: 400;
        font-style: normal;
        margin: 0;
        padding: 0;
        width: 100%;
        /* Removi o height: 100vh para permitir o scroll da página */
        background-color: #000000;
      }

      /* Topo */
      header {
        background: #050708; /* O cinza fosco que você escolheu */
        border-bottom: 2px solid #8e7355;
        padding: 15px 40px;

        /* Mantém fixo no topo */
        position: sticky;
        top: 0;
        z-index: 1000;

        /* Alinhamento dos itens */
        display: flex;
        align-items: center;
        justify-content: space-between; /* Empurra a logo para esquerda e a lista para direita */
      }

      /* Logo topo */
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        color: white;
      }

      .logo-icon {
        width: 55px;
        height: 55px;
        background: #a68966;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: bold;
        color: #0d1b2a;
      }

      .logo-text {
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 2px;
      }

      .logo-sub {
        font-size: 12px;
        color: #d9d9d9;
        margin-top: -5px;
      }

      /* Lista de navegação no final */
      .list-header {
        display: flex; /* Para os links ficarem um ao lado do outro */
        gap: 25px; /* Espaçamento entre os links */
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .list-header a {
        color: white;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s;
      }

      .list-header a:hover {
        color: #8e7355; /* Cor bronze ao passar o mouse */
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo">
        <div class="logo-icon">⚖</div>
        <div class="logo-info">
          <div class="logo-text">LESI</div>
          <div class="logo-sub">Assessoria Jurídica</div>
        </div>
      </div>

      <ul class="list-header">
        <li><a href="#">Home</a></li>
        <li><a href="#">Projetos</a></li>
        <li><a href="#">Contato</a></li>
        <li><a href="#">Login</a></li>
      </ul>
    </header>
  </body>
</html>
